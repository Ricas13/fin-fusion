name: Apply Customer Portal IA Fix

on:
  push:
    branches:
      - fix/stremio-home-server-render
    paths:
      - .github/workflows/apply-customer-portal-ia-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-home-server-render
          fetch-depth: 0
      - name: Update canonical Stremio destination regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/customer-portal-ia-smoke.js')
          s=p.read_text()
          old="assert(stremioRoute.includes(\"r.get('/account/stremio',(req,res)=>res.redirect(302,'/account#stremio-access'))\"),'legacy Stremio setup URL must redirect to the canonical Home Stremio section');"
          new="assert(stremioRoute.includes(\"r.get('/account/stremio',(req,res)=>res.redirect(302,'/account/access#stremio-access'))\"),'legacy Stremio setup URL must redirect to the canonical My Access Stremio section');"
          assert old in s, 'stale Home Stremio redirect assertion not found'
          p.write_text(s.replace(old,new,1))
          PY
          node scripts/customer-portal-ia-smoke.js
          git diff --check
          git config user.name "Ricas13"
          git config user.email "56263921+Ricas13@users.noreply.github.com"
          git add scripts/customer-portal-ia-smoke.js
          git commit -m "Update customer portal Stremio destination regression"
          git push origin HEAD:fix/stremio-home-server-render
