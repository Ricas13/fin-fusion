name: Admin Coherence Temp
on:
  push:
    branches: [fix/admin-coherence-user-overrides-plan-ux]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-coherence-user-overrides-plan-ux
          fetch-depth: 0
      - name: Apply coherence follow-up
        run: python3 scripts/apply-admin-coherence-followup.py
      - name: Commit coherence follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/admin-original-settings.js src/platform/admin-plan-order.js src/platform/admin-customer-360.js src/platform/customer-360-view-v2.js src/stremio/source-pool.js src/platform/admin-stremio-sources.js scripts/admin-coherence-user-overrides-smoke.js
          git commit -m "Finish admin coherence and Stremio source flow"
          git push origin HEAD:fix/admin-coherence-user-overrides-plan-ux
