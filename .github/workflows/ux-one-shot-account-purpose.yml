name: UX one-shot account purpose fix

on:
  push:
    branches:
      - ux-control-centre-simplification

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-control-centre-simplification
          fetch-depth: 0
      - name: Normalize Jellyfin account-purpose capacity count
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/platform/admin-bulk-customers.js')
          s=p.read_text()
          old="account_purpose='primary'"
          if old not in s:
              raise SystemExit('expected legacy account purpose not found')
          s=s.replace(old,"account_purpose='jellyfin'")
          p.write_text(s)

          p=Path('scripts/ux-control-centre-smoke.js')
          s=p.read_text()
          marker="assert(!/Use the plan UUID/.test(bulk)&&!/Use the server UUID/.test(bulk),'raw UUID workflow copy returned');"
          addition="assert(/account_purpose='jellyfin'/.test(bulk)&&!/account_purpose='primary'/.test(bulk),'bulk server capacity labels must count normal Jellyfin accounts');"
          if addition not in s:
              if marker not in s:
                  raise SystemExit('smoke insertion marker not found')
              s=s.replace(marker,marker+'\n'+addition)
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/platform/admin-bulk-customers.js scripts/ux-control-centre-smoke.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix bulk Jellyfin capacity accounting"
          git push origin HEAD:ux-control-centre-simplification
