name: Affiliate mixed payment patch
on:
  push:
    branches: [feat/affiliate-service-credits]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Integrate affiliate mixed payments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/affiliate-service-credits
      - run: python3 scripts/apply-affiliate-mixed-payment-patch.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/payments/checkout-intents.js src/affiliate-credits.js src/platform/flexible-checkout.js src/payments/stripe.js src/payments/paypal.js
          git commit -m 'Integrate affiliate mixed payments'
          git push origin HEAD:feat/affiliate-service-credits
