name: Fast Check Diagnostic

on:
  pull_request:
    paths:
      - 'scripts/fast-check-diagnostic.js'
      - 'package.json'
      - 'src/**'
      - 'scripts/**'
      - 'views/**'
      - 'docs/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run every fast contract independently
        run: node scripts/fast-check-diagnostic.js
