name: Browser reseller cleanup
on:
  push:
    branches: [feat/affiliate-service-credits]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Remove retired reseller browser target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/affiliate-service-credits
      - run: python3 scripts/remove-retired-reseller-browser-check.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tests/admin-browser-regression.js
          git commit -m 'Remove retired reseller browser target'
          git push origin HEAD:feat/affiliate-service-credits
