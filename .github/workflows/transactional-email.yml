name: Transactional Email

on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'src/integrations/smtp-client.js'
      - 'src/integrations/email-settings.js'
      - 'src/integrations/email-outbox.js'
      - 'src/platform/admin-email.js'
      - 'src/platform/router.js'
      - 'src/platform/setup-readiness.js'
      - 'src/customers.js'
      - 'views/customer/forgot-password.ejs'
      - 'views/customer/reset-password.ejs'
      - 'views/customer/login.ejs'
      - 'platform-preload.js'
      - 'scripts/transactional-email-smoke.js'
      - '.github/workflows/transactional-email.yml'
  workflow_dispatch:

jobs:
  transactional-email:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transactional_email
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transactional_email"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check src/integrations/smtp-client.js
          node --check src/integrations/email-settings.js
          node --check src/integrations/email-outbox.js
          node --check src/platform/admin-email.js
          node --check src/platform/router.js
          node --check src/customers.js
          node --check scripts/transactional-email-smoke.js
          node --check platform-preload.js
      - name: Migrate database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/transactional_email
        run: npm run db:migrate
      - name: Browser SMTP, encrypted outbox and password reset
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/transactional_email
          DATA_ENCRYPTION_KEY: '2222222222222222222222222222222222222222222222222222222222222222'
          JELLYFIN_ENCRYPTION_KEY: '3333333333333333333333333333333333333333333333333333333333333333'
          AUTH_ENCRYPTION_KEY: '5555555555555555555555555555555555555555555555555555555555555555'
        run: node scripts/transactional-email-smoke.js
