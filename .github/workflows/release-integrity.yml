name: Release Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: steamfusion
          POSTGRES_PASSWORD: steamfusion
          POSTGRES_DB: steamfusion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamfusion -d steamfusion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://steamfusion:steamfusion@127.0.0.1:5432/steamfusion
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JELLYFIN_ENCRYPTION_KEY: 1123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ACTIVITY_ENCRYPTION_KEY: 2123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_ENCRYPTION_KEY: 3123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BACKUP_ENCRYPTION_KEY: 5123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_SECRET: 4123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci

      - name: Supply-chain pinning policy
        run: node scripts/supply-chain-integrity-smoke.js

      - name: Production web database role guard
        run: node scripts/web-database-role-smoke.js

      - name: Generate release evidence
        run: |
          mkdir -p test-results/release-evidence
          npm sbom --omit=dev --sbom-format=cyclonedx > test-results/release-evidence/captainfin-sbom.cdx.json
          node scripts/release-evidence.js test-results/release-evidence

      - name: Workflow trigger and suite hygiene
        run: node scripts/workflow-trigger-hygiene-smoke.js

      - name: Apply schema on production PostgreSQL major
        run: npm run db:migrate

      - name: Database release checks
        run: npm run check:db

      - name: Global assembled route ownership
        run: node scripts/assembled-route-ownership-smoke.js

      - name: Previous-schema upgrade contract
        run: node scripts/lifecycle-upgrade-smoke.js

      - name: Production readiness schema contract
        run: node scripts/production-readiness.js --json --ci-schema

      - name: Rebuild clean schema for baseline audit
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query('DROP SCHEMA IF EXISTS public CASCADE');
            await client.query('CREATE SCHEMA public');
            await client.end();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          npm run db:migrate

      - name: Verify generated schema contains no retired product vocabulary
        shell: bash
        run: |
          docker run --rm --network host postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 \
            pg_dump "$DATABASE_URL" --no-owner --no-privileges --inserts \
            --exclude-table=schema_migrations \
            --exclude-table=user_sessions \
            > /tmp/database.sql
          term="$(printf 're%s' 'seller')"
          if grep -in "$term" /tmp/database.sql; then
            echo "::error::Retired product vocabulary remains in generated database"
            exit 1
          fi

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence
          path: test-results/release-evidence
          if-no-files-found: warn
          retention-days: 30
