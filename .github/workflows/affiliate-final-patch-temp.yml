name: Affiliate final patch
on:
  push:
    branches: [feat/affiliate-service-credits]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply affiliate final integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/affiliate-service-credits
      - name: Apply focused replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/platform/configuration-transfer-atomic.js');s=p.read_text();old="const V2_SETTINGS = new Set(['reseller_defaults_v2','trial_free_policy','commerce_policy','jellyfin_drift_policy','payment_risk_policy']);";new="const V2_SETTINGS = new Set(['reseller_defaults_v2','trial_free_policy','commerce_policy','jellyfin_drift_policy','payment_risk_policy','affiliate_program']);"
          if old in s:p.write_text(s.replace(old,new))
          p=Path('src/application.js');s=p.read_text();old="app.get('/reseller*',(_req,res)=>res.redirect(302,'/account?error='+encodeURIComponent('The reseller programme has been retired. Use the affiliate programme instead.')));\n app.get('/admin/reseller*',(_req,res)=>res.redirect(302,'/admin/referrals?message='+encodeURIComponent('The reseller programme has been retired and replaced by Affiliates.')));";new="app.use(/^\\/reseller(?:\\/|$)/,(_req,res)=>res.redirect(302,'/account?error='+encodeURIComponent('The reseller programme has been retired. Use the affiliate programme instead.')));\n app.use(/^\\/admin\\/reseller(?:\\/|$)/,(_req,res)=>res.redirect(302,'/admin/referrals?message='+encodeURIComponent('The reseller programme has been retired and replaced by Affiliates.')));"
          if old in s:p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/platform/configuration-transfer-atomic.js src/application.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply affiliate final integration patch'
          git push origin HEAD:feat/affiliate-service-credits
