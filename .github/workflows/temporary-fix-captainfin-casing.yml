name: Temporary CAPTAiNFiN casing fix

on:
  push:
    branches:
      - fix/reseller-seat-licensing-main

permissions:
  contents: write

jobs:
  fix-casing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reseller-seat-licensing-main
      - name: Normalize CAPTAiNFiN casing
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -RIl --exclude-dir=.git 'CAPTaINFiN' src public scripts views docs README.md 2>/dev/null | grep -q .; then
            echo 'No wrong casing remains.'
            exit 0
          fi
          grep -RIl --exclude-dir=.git 'CAPTaINFiN' src public scripts views docs README.md 2>/dev/null | xargs sed -i 's/CAPTaINFiN/CAPTAiNFiN/g'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public scripts views docs README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize CAPTAiNFiN project casing'
          git push origin HEAD:fix/reseller-seat-licensing-main
