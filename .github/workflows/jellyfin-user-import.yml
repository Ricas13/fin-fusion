name: Jellyfin User Import

on:
  pull_request:
    paths:
      - 'src/jellyfin/user-import.js'
      - 'src/platform/admin-jellyfin-import.js'
      - 'src/platform/admin-html.js'
      - 'platform-preload.js'
      - 'scripts/jellyfin-user-import-smoke.js'
      - '.github/workflows/jellyfin-user-import.yml'
  workflow_dispatch:

jobs:
  jellyfin-user-import:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jellyfin_user_import
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jellyfin_user_import"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check src/jellyfin/user-import.js
          node --check src/platform/admin-jellyfin-import.js
          node --check scripts/jellyfin-user-import-smoke.js
          node --check platform-preload.js
      - name: Migrate database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jellyfin_user_import
        run: npm run db:migrate
      - name: Adopt existing Jellyfin users safely
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jellyfin_user_import
        run: node scripts/jellyfin-user-import-smoke.js
