name: Apply PR317 mobile hardening

on:
  push:
    branches:
      - feature/recurring-subscriptions-and-transactions
    paths:
      - .github/workflows/apply-pr317-mobile.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/recurring-subscriptions-and-transactions
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
      - name: Apply mobile hardening
        run: python3 scripts/apply_pr317_mobile.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run mobile and focused regressions
        run: |
          node scripts/admin-accessibility-mobile-smoke.js
          node scripts/subscription-discovery-smoke.js
          node scripts/transaction-browser-smoke.js
          node scripts/admin-navigation-coherence-smoke.js
      - name: Run syntax checks
        run: npm run syntax
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/platform/admin-billing.js \
            src/platform/admin-transactions.js \
            scripts/admin-accessibility-mobile-smoke.js \
            tests/admin-browser-regression.js
          git commit -m "Harden billing and transactions for mobile"
          git push origin HEAD:feature/recurring-subscriptions-and-transactions
