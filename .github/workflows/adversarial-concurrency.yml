name: Adversarial Concurrency

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steamfusion
          POSTGRES_PASSWORD: steamfusion
          POSTGRES_DB: steamfusion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamfusion -d steamfusion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://steamfusion:steamfusion@127.0.0.1:5432/steamfusion
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JELLYFIN_ENCRYPTION_KEY: 1123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ACTIVITY_ENCRYPTION_KEY: 2123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_ENCRYPTION_KEY: 3123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_SECRET: 4123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and lifecycle boundaries
        id: fastcheck
        shell: bash
        run: |
          set +e
          npm run check:fast 2>&1 | tee /tmp/check-fast.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload fast-check failure output
        if: failure() && steps.fastcheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: check-fast-failure
          path: /tmp/check-fast.log
          if-no-files-found: error
          retention-days: 7
      - name: Apply migrations
        run: npm run db:migrate
      - name: Race transaction invariants
        run: node scripts/adversarial-concurrency-smoke.js
      - name: Referral qualification safety
        run: node scripts/referral-safety-smoke.js
