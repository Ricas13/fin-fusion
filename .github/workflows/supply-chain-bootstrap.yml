name: Supply Chain Bootstrap

on:
  push:
    branches: [hardening/supply-chain-reproducibility]
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply immutable supply-chain pins
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          workflow_dir = root / '.github' / 'workflows'

          checkout = 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262'
          setup_node = 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020'
          upload_artifact = 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
          codeql_init = 'github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd'
          codeql_analyze = 'github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd'
          postgres = 'postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193'
          node_image = 'node:22.23.1-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2'

          replacements = {
              'actions/checkout@v4': checkout,
              'actions/setup-node@v4': setup_node,
              'actions/upload-artifact@v4': upload_artifact,
              'github/codeql-action/init@v4': codeql_init,
              'github/codeql-action/analyze@v4': codeql_analyze,
              'postgres:17-alpine': postgres,
              "node-version: '22'": "node-version: '22.23.1'",
          }

          for path in sorted(workflow_dir.glob('*.yml')):
              if path.name == 'supply-chain-bootstrap.yml':
                  continue
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          dockerfile = root / 'Dockerfile'
          text = dockerfile.read_text().replace('FROM node:22-alpine', f'FROM {node_image}', 1)
          dockerfile.write_text(text)

          compose = root / 'docker-compose.yml'
          text = compose.read_text().replace('image: postgres:17-alpine', f'image: {postgres}')
          compose.write_text(text)

          release = workflow_dir / 'release-integrity.yml'
          text = release.read_text()
          install_marker = '      - run: npm ci\n'
          supply_chain_steps = '''      - run: npm ci

      - name: Supply-chain pinning policy
        run: node scripts/supply-chain-integrity-smoke.js

      - name: Generate release evidence
        run: |
          mkdir -p test-results/release-evidence
          npm sbom --omit=dev --sbom-format=cyclonedx > test-results/release-evidence/captainfin-sbom.cdx.json
          node scripts/release-evidence.js test-results/release-evidence
'''
          if 'Supply-chain pinning policy' not in text:
              if install_marker not in text:
                  raise SystemExit('release-integrity npm ci marker not found')
              text = text.replace(install_marker, supply_chain_steps, 1)

          if 'Upload release evidence' not in text:
              text = text.rstrip() + f'''

      - name: Upload release evidence
        if: always()
        uses: {upload_artifact}
        with:
          name: release-evidence
          path: test-results/release-evidence
          if-no-files-found: warn
          retention-days: 30
'''
          release.write_text(text)
          PY

      - name: Verify policy and evidence generator
        run: |
          node scripts/supply-chain-integrity-smoke.js
          rm -rf /tmp/captainfin-release-evidence
          node scripts/release-evidence.js /tmp/captainfin-release-evidence
          test -s /tmp/captainfin-release-evidence/provenance.json
          test -s /tmp/captainfin-release-evidence/checksums.sha256

      - name: Remove one-shot bootstrap workflow
        run: rm .github/workflows/supply-chain-bootstrap.yml

      - name: Commit hardened inputs
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No supply-chain changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile docker-compose.yml .github scripts
          git commit -m 'Pin build and CI supply-chain inputs'
          git push origin HEAD:hardening/supply-chain-reproducibility
