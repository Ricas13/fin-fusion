name: Apply Final Cleanup

on:
  push:
    branches: [remove-reseller-feature-completely]
  pull_request:
    types: [synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-reseller-feature-completely
          fetch-depth: 0
      - name: Apply validated cleanup snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f cleanup-payload.b64
          base64 -d cleanup-payload.b64 | xz -d | tar -x -C .
          rm -f cleanup-payload.b64 .github/workflows/source-snapshot.yml .github/workflows/apply-final-cleanup.yml
          node scripts/no-retired-product-traces-smoke.js
          node scripts/check-js-syntax.js
          node scripts/lifecycle-boundary-static.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Complete retired product removal'
          git push origin HEAD:remove-reseller-feature-completely
