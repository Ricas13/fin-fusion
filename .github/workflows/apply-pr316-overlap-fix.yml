name: Apply PR316 overlap fix

on:
  push:
    branches:
      - fix/legacy-import-overlap-extension
    paths:
      - .github/workflows/apply-pr316-overlap-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/legacy-import-overlap-extension
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
      - name: Apply overlap extension patch
        run: python3 scripts/pr316_overlap_patch.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run focused migration regression
        run: node scripts/legacy-customer-import-smoke.js
      - name: Run syntax checks
        run: npm run syntax
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/payments/legacy-customer-import.js src/platform/admin-legacy-customer-import.js scripts/legacy-customer-import-smoke.js
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "Allow safe legacy subscription extensions"
          git push origin HEAD:fix/legacy-import-overlap-extension
