name: Monthly Reseller Tiers

on:
  pull_request:
    paths:
      - 'db/migrations/035_monthly_reseller_tiers.sql'
      - 'src/resellers/**'
      - 'src/payments/reseller-billing.js'
      - 'src/platform/reseller-monthly-portal.js'
      - 'src/platform/reseller-storefront.js'
      - 'src/platform/admin-reseller-tiers.js'
      - 'src/platform/webhooks.js'
      - 'src/platform/admin-html.js'
      - 'platform-preload.js'
      - 'scripts/monthly-reseller-tiers-smoke.js'
      - '.github/workflows/monthly-reseller-tiers.yml'
  workflow_dispatch:

jobs:
  reseller-monthly:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: steamfusion
          POSTGRES_PASSWORD: steamfusion
          POSTGRES_DB: steamfusion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamfusion -d steamfusion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://steamfusion:steamfusion@127.0.0.1:5432/steamfusion
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_ENCRYPTION_KEY: 3123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check src/resellers/monthly.js
          node --check src/resellers/jobs.js
          node --check src/payments/reseller-billing.js
          node --check src/platform/admin-reseller-tiers.js
          node --check src/platform/reseller-monthly-portal.js
          node --check src/platform/reseller-storefront.js
          node --check src/platform/webhooks.js
          node --check platform-preload.js
          node --check scripts/monthly-reseller-tiers-smoke.js
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Monthly reseller entitlement, seats, sales and estate smoke
        run: node scripts/monthly-reseller-tiers-smoke.js
