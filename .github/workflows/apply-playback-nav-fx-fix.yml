name: Apply playback navigation and FX fix

on:
  push:
    branches:
      - fix/playback-nav-fx-warning

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/playback-nav-fx-warning
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - name: Apply fixes
        run: python3 scripts/apply-playback-nav-fx-fix.py
      - name: Validate focused contracts
        run: |
          node scripts/check-js-syntax.js
          node scripts/admin-accessibility-mobile-smoke.js
          node scripts/storefront-currency-integrity-smoke.js
      - name: Commit clean production diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-playback-nav-fx-fix.yml scripts/apply-playback-nav-fx-fix.py
          git add src/platform/admin-nav.js src/platform/reporting-currency.js views/admin/_nav.ejs scripts/admin-accessibility-mobile-smoke.js scripts/storefront-currency-integrity-smoke.js tests/admin-browser-regression.js
          git commit -m "Fix playback navigation and FX refresh"
          git push origin HEAD:fix/playback-nav-fx-warning
