name: Browser & Clean Install

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: steamfusion
          POSTGRES_PASSWORD: steamfusion
          POSTGRES_DB: steamfusion_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamfusion -d steamfusion_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://steamfusion:steamfusion@127.0.0.1:5432/steamfusion_browser
      NODE_ENV: test
      PORT: '3030'
      COOKIE_SECURE: 'false'
      SESSION_SECRET: browser-regression-session-secret-2026-very-long-and-unique-value
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JELLYFIN_ENCRYPTION_KEY: 1123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ACTIVITY_ENCRYPTION_KEY: 2123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_ENCRYPTION_KEY: 3123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      STREMIO_JELLYFIN_TOKEN_KEY: 4123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_USERNAME: browseradmin
      ADMIN_PASSWORD: BrowserAuditPass!2026
      ADMIN_EMAIL: browseradmin@example.invalid
      REQUIRE_ADMIN_2FA: 'false'
      BROWSER_ADMIN_USERNAME: browseradmin
      BROWSER_ADMIN_PASSWORD: BrowserAuditPass!2026
      BROWSER_BASE_URL: http://127.0.0.1:3030

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare clean browser database
        run: |
          npm run db:migrate
          npm run auth:bootstrap
      - name: Audit mounted admin route ownership
        run: node scripts/admin-route-ownership-audit.js
      - name: Start CAPTAiNFiN
        run: |
          node src/application.js > /tmp/captainfin-browser.log 2>&1 &
          echo $! > /tmp/captainfin-browser.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3030/health/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/captainfin-browser.log
          exit 1
      - name: Crawl authenticated admin UI in Chromium
        run: node tests/admin-browser-regression.js
      - name: Prove mounted state-changing admin routes
        run: node tests/admin-mounted-mutations-journey.js
      - name: Seed admin information architecture fixture
        run: node tests/seed-admin-ia-fixture.js
      - name: Verify admin information architecture in Chromium
        shell: bash
        run: |
          set +e
          OUTPUT="$(node tests/admin-information-architecture-regression.js 2>&1)"
          STATUS=$?
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            DETAIL="$(printf '%s' "$OUTPUT" | tail -c 2500 | tr '\n' ' ')"
            echo "::error title=Admin IA regression::$DETAIL"
            exit "$STATUS"
          fi
      - name: Simulate admin to customer activation and sign-in
        run: node tests/admin-customer-activation-journey.js
      - name: Simulate deferred Jellyfin provisioning after activation
        run: node tests/admin-deferred-provisioning-journey.js
      - name: Print app log on failure
        if: failure()
        run: cat /tmp/captainfin-browser.log || true
      - name: Upload browser audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-browser-audit
          path: test-results/admin-browser
          if-no-files-found: warn
          retention-days: 14

  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clean"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci

      - name: Migrate blank database with browser setup pending
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/clean
        run: npm run db:migrate && npm run auth:bootstrap

      - name: Assert zero-data and zero-admin clean-install state
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/clean
          CLEAN_INSTALL_EXPECTED: 'true'
          CLEAN_INSTALL_EXPECT_ADMINS: '0'
          PUBLIC_REGISTRATION: 'true'
          STOREFRONT_ENABLED: 'true'
        run: node scripts/clean-install-smoke.js

      - name: Create upgrade-simulation database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const admin = new Client({ connectionString: process.env.DATABASE_URL });
            await admin.connect();
            await admin.query('CREATE DATABASE clean_upgrade');
            await admin.end();
            const upgrade = new Client({ connectionString: 'postgres://postgres:postgres@127.0.0.1:5432/clean_upgrade' });
            await upgrade.connect();
            await upgrade.query('CREATE TABLE legacy_marker(id integer primary key)');
            await upgrade.end();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Migrate upgrade simulation
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/clean_upgrade
        run: npm run db:migrate

      - name: Assert upgrade data is preserved
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/clean_upgrade
          CLEAN_INSTALL_EXPECTED: 'false'
        run: node scripts/clean-install-smoke.js

      - name: Browser first-run creates first admin and locks installer
        env:
          NODE_ENV: production
          PORT: '3031'
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/clean
          SESSION_SECRET: '1111111111111111111111111111111111111111111111111111111111111111'
          DATA_ENCRYPTION_KEY: '2222222222222222222222222222222222222222222222222222222222222222'
          JELLYFIN_ENCRYPTION_KEY: '3333333333333333333333333333333333333333333333333333333333333333'
          ACTIVITY_ENCRYPTION_KEY: '4444444444444444444444444444444444444444444444444444444444444444'
          AUTH_ENCRYPTION_KEY: '5555555555555555555555555555555555555555555555555555555555555555'
          COOKIE_SECURE: 'false'
          REQUIRE_ADMIN_2FA: 'false'
        run: |
          npm start > /tmp/clean-start.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/cookies.txt http://127.0.0.1:3031/setup -o /tmp/claim.html; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'Application process exited before the first-run endpoint became ready.'
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo '=== APPLICATION STARTUP LOG ==='
            cat /tmp/clean-start.log || true
            echo '=== END APPLICATION STARTUP LOG ==='
            exit 1
          fi
          cat /tmp/clean-start.log
          grep -q 'CAPTAiNFiN running' /tmp/clean-start.log
          grep -q 'Jellyfin: not configured' /tmp/clean-start.log
          grep -q 'FIRST-RUN SETUP CODE:' /tmp/clean-start.log
          grep -q 'Verify this installation' /tmp/claim.html
          grep -q 'Why this is required' /tmp/claim.html

          curl -fsS -D /tmp/login-before.headers -o /dev/null http://127.0.0.1:3031/login
          grep -qi '^location: /setup' /tmp/login-before.headers

          claim=$(sed -n 's/.*FIRST-RUN SETUP CODE: \([^[:space:]]*\).*/\1/p' /tmp/clean-start.log | tail -1)
          test -n "$claim"
          csrf=$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/claim.html | head -1)
          test -n "$csrf"

          curl -fsS -b /tmp/cookies.txt -c /tmp/cookies.txt -X POST \
            --data-urlencode "_csrf=$csrf" --data-urlencode "setupCode=$claim" \
            -D /tmp/claim-post.headers -o /tmp/claim-post.html http://127.0.0.1:3031/setup/claim
          grep -qi '^location: /setup' /tmp/claim-post.headers

          curl -fsS -b /tmp/cookies.txt -c /tmp/cookies.txt http://127.0.0.1:3031/setup -o /tmp/setup.html
          grep -q 'Create the first administrator' /tmp/setup.html
          grep -q 'What happens next?' /tmp/setup.html
          grep -q 'Create administrator & continue setup' /tmp/setup.html
          csrf2=$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/setup.html | head -1)
          test -n "$csrf2"

          curl -fsS -b /tmp/cookies.txt -c /tmp/cookies.txt -X POST \
            --data-urlencode "_csrf=$csrf2" \
            --data-urlencode "siteName=Browser Test Streams" \
            --data-urlencode "username=browseradmin" \
            --data-urlencode "email=browseradmin@example.test" \
            --data-urlencode "password=Browser-First-Run-Password-2026!" \
            --data-urlencode "passwordConfirm=Browser-First-Run-Password-2026!" \
            -D /tmp/setup-post.headers -o /tmp/setup-post.html http://127.0.0.1:3031/setup/complete
          grep -qi '^location: /admin/setup' /tmp/setup-post.headers

          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3031/admin/setup -o /tmp/admin-setup.html
          grep -q 'Browser Test Streams' /tmp/admin-setup.html
          grep -q 'Configure CAPTAiNFiN at your own pace' /tmp/admin-setup.html
          grep -q '0 of 9 optional capabilities are configured' /tmp/admin-setup.html
          grep -q 'Suggested next optional step' /tmp/admin-setup.html

          curl -fsS -b /tmp/cookies.txt -D /tmp/setup-locked.headers -o /dev/null http://127.0.0.1:3031/setup
          grep -qi '^location: /admin/setup' /tmp/setup-locked.headers

          node <<'NODE'
          const { query, getPool } = require('./src/db');
          (async () => {
            const admins = await query("SELECT username,legacy_numeric_id FROM app_users WHERE role='admin'");
            if (admins.rowCount !== 1 || admins.rows[0].username !== 'browseradmin') throw new Error('browser setup did not create exactly one administrator');
            if (!Number(admins.rows[0].legacy_numeric_id)) throw new Error('browser admin compatibility id missing');
            const settings = await query("SELECT setting_value FROM platform_settings WHERE setting_key='platform'");
            if (settings.rows[0]?.setting_value?.siteName !== 'Browser Test Streams') throw new Error('site identity was not persisted');
            const installation = await query("SELECT setting_value FROM platform_settings WHERE setting_key='installation'");
            const value = installation.rows[0]?.setting_value || {};
            if (!value.browserSetupCompleted || !value.setupCompletedAt) throw new Error('setup completion marker missing');
            if (value.firstRunClaimHash) throw new Error('claim hash was not destroyed after setup');
          })().finally(() => getPool().end());
          NODE

          if npm run setup:claim >/tmp/claim-after.log 2>&1; then
            cat /tmp/claim-after.log
            echo 'setup:claim unexpectedly succeeded after installer lock'
            exit 1
          fi
          grep -q 'already locked' /tmp/claim-after.log
