name: Link Customer Dashboard CSS Temp
on:
  push:
    branches: [fix/free-access-provisioning-customer-portal]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/free-access-provisioning-customer-portal
      - run: python3 scripts/link-customer-dashboard-css.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/customer/dashboard.ejs
          git commit -m "Load customer dashboard application styles"
          git push origin HEAD:fix/free-access-provisioning-customer-portal
