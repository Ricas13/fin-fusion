name: Request User Sync

on:
  pull_request:
    paths:
      - 'db/migrations/027_request_user_sync.sql'
      - 'src/integrations/request-user-sync.js'
      - 'src/platform/admin-request-users.js'
      - 'src/platform/admin-provisioning.js'
      - 'src/platform/router.js'
      - 'views/customer/dashboard.ejs'
      - 'platform-preload.js'
      - 'scripts/request-user-sync-smoke.js'
      - '.github/workflows/request-user-sync.yml'
  workflow_dispatch:

jobs:
  request-user-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: request_user_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d request_user_sync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check src/integrations/request-user-sync.js
          node --check src/platform/admin-request-users.js
          node --check src/platform/admin-provisioning.js
          node --check src/platform/router.js
          node --check scripts/request-user-sync-smoke.js
          node --check platform-preload.js
      - name: Migrate database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/request_user_sync
        run: npm run db:migrate
      - name: Aggregate all Jellyfin users into one request service
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/request_user_sync
        run: node scripts/request-user-sync-smoke.js
