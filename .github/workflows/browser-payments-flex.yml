name: Browser Payments & Flexible Checkout

on:
  pull_request:
    paths:
      - 'db/migrations/029_browser_payments_and_flexible_checkout.sql'
      - 'src/payments/provider-settings.js'
      - 'src/payments/stripe.js'
      - 'src/payments/paypal.js'
      - 'src/payments/lifecycle.js'
      - 'src/platform/admin-payment-settings.js'
      - 'src/platform/admin-plan-payment-options.js'
      - 'src/platform/flexible-checkout.js'
      - 'src/platform/webhooks.js'
      - 'src/platform/customer-filters.js'
      - 'src/platform/admin-customers-list.js'
      - 'views/customer/payment-choice.ejs'
      - 'platform-preload.js'
      - 'scripts/browser-payments-flex-smoke.js'
      - '.github/workflows/browser-payments-flex.yml'
  workflow_dispatch:

jobs:
  browser-payments-flex:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: browser_payments_flex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d browser_payments_flex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check src/payments/provider-settings.js
          node --check src/payments/stripe.js
          node --check src/payments/paypal.js
          node --check src/payments/lifecycle.js
          node --check src/platform/admin-payment-settings.js
          node --check src/platform/admin-plan-payment-options.js
          node --check src/platform/flexible-checkout.js
          node --check src/platform/webhooks.js
          node --check src/platform/customer-filters.js
          node --check src/platform/admin-customers-list.js
          node --check scripts/browser-payments-flex-smoke.js
          node --check platform-preload.js
      - name: Migrate database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/browser_payments_flex
        run: npm run db:migrate
      - name: Browser credentials, flexible mappings and server column
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/browser_payments_flex
          DATA_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
        run: node scripts/browser-payments-flex-smoke.js
