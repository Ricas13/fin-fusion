name: Stremio

# This workflow is part of the full pre-merge release gate. workflow_dispatch
# remains available for changes outside the Stremio path filter when needed.
on:
  pull_request:
    paths:
      - 'src/stremio/**'
      - 'src/application.js'
      - 'src/jellyfin/activity.js'
      - 'src/jellyfin/resilient-provisioning.js'
      - 'src/automation/jobs.js'
      - 'src/platform/admin-stremio*.js'
      - 'src/platform/admin-plan-create-v2.js'
      - 'src/platform/admin-plan-delivery.js'
      - 'src/platform/admin-plans-list.js'
      - 'src/platform/admin-nav.js'
      - 'src/platform/product-readiness.js'
      - 'src/platform/customer-stremio.js'
      - 'src/platform/customer-dashboard.js'
      - 'src/platform/storefront-core.js'
      - 'src/platform/router.js'
      - 'public/js/admin-plan-create-v2.js'
      - 'views/customer/stremio.ejs'
      - 'views/customer/stremio-dashboard.ejs'
      - 'views/customer/dashboard.ejs'
      - 'db/migrations/**'
      - 'scripts/stremio-*.js'
      - 'tests/admin-information-architecture-regression.js'
      - 'package.json'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/stremio.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: npm run syntax
      - name: Runtime and source contracts
        run: |
          node scripts/stremio-source-client-smoke.js
          node scripts/stremio-admin-smoke.js
          node scripts/stremio-playback-compatibility-smoke.js
          node scripts/stremio-household-access-smoke.js
