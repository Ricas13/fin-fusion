name: Stremio

# This workflow is part of the full pre-merge release gate and therefore runs
# on every pull request. Keeping it unconditional makes exact-head validation
# automatic instead of relying on a manual workflow_dispatch for unrelated PRs.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: npm run syntax
      - name: Runtime and source contracts
        run: |
          node scripts/stremio-source-client-smoke.js
          node scripts/stremio-admin-smoke.js
          node scripts/stremio-playback-compatibility-smoke.js
          node scripts/stremio-household-access-smoke.js
          node scripts/stremio-access-error-smoke.js
          node scripts/stremio-edge-auth-smoke.js
