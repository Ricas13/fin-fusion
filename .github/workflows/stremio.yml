name: Stremio

# This workflow is part of the full pre-merge release gate and therefore runs
# on every pull request. Keeping it unconditional makes exact-head validation
# automatic instead of relying on a manual workflow_dispatch for unrelated PRs.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: npm run syntax
      - name: Runtime and source contracts
        run: |
          node scripts/stremio-source-client-smoke.js
          node scripts/stremio-admin-smoke.js
          node scripts/stremio-playback-compatibility-smoke.js
          node scripts/stremio-household-access-smoke.js
          node scripts/stremio-edge-auth-smoke.js

  supply-chain-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hardening/supply-chain-reproducibility
          fetch-depth: 0

      - name: Apply immutable supply-chain pins
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checkout = 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262'
          setup_node = 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020'
          upload_artifact = 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
          codeql = 'ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd'
          postgres = 'postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193'
          node_image = 'node:22.23.1-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2'
          replacements = {'actions/checkout@v4': checkout, 'actions/setup-node@v4': setup_node, 'actions/upload-artifact@v4': upload_artifact, 'github/codeql-action/init@v4': f'github/codeql-action/init@{codeql}', 'github/codeql-action/analyze@v4': f'github/codeql-action/analyze@{codeql}', 'postgres:17-alpine': postgres, "node-version: '22'": "node-version: '22.23.1'"}
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              if path.name in {'stremio.yml', 'supply-chain-bootstrap.yml'}:
                  continue
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          dockerfile = Path('Dockerfile')
          dockerfile.write_text(dockerfile.read_text().replace('FROM node:22-alpine', f'FROM {node_image}', 1))
          compose = Path('docker-compose.yml')
          compose.write_text(compose.read_text().replace('image: postgres:17-alpine', f'image: {postgres}'))
          release = Path('.github/workflows/release-integrity.yml')
          text = release.read_text()
          if 'Supply-chain pinning policy' not in text:
              marker = '      - run: npm ci\n'
              replacement = '      - run: npm ci\n\n      - name: Supply-chain pinning policy\n        run: node scripts/supply-chain-integrity-smoke.js\n\n      - name: Generate release evidence\n        run: |\n          mkdir -p test-results/release-evidence\n          npm sbom --omit=dev --sbom-format=cyclonedx > test-results/release-evidence/captainfin-sbom.cdx.json\n          node scripts/release-evidence.js test-results/release-evidence\n'
              if marker not in text:
                  raise SystemExit('release-integrity npm ci marker not found')
              text = text.replace(marker, replacement, 1)
          if 'Upload release evidence' not in text:
              upload = f'\n\n      - name: Upload release evidence\n        if: always()\n        uses: {upload_artifact}\n        with:\n          name: release-evidence\n          path: test-results/release-evidence\n          if-no-files-found: warn\n          retention-days: 30\n'
              text = text.rstrip() + upload
          release.write_text(text)
          PY
          printf '%s' '' | base64 -d > .github/workflows/stremio.yml
          rm -f .github/workflows/supply-chain-bootstrap.yml

      - name: Verify policy and evidence generator
        run: |
          node scripts/supply-chain-integrity-smoke.js
          rm -rf /tmp/captainfin-release-evidence
          node scripts/release-evidence.js /tmp/captainfin-release-evidence
          test -s /tmp/captainfin-release-evidence/provenance.json
          test -s /tmp/captainfin-release-evidence/checksums.sha256

      - name: Commit hardened inputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile docker-compose.yml .github scripts
          git commit -m 'Pin build and CI supply-chain inputs'
          git push origin HEAD:hardening/supply-chain-reproducibility
