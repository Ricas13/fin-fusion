name: Admin Analytics Dashboard

on:
  pull_request:
    paths:
      - 'src/platform/admin-dashboard*.js'
      - 'public/css/admin-dashboard-analytics.css'
      - 'scripts/admin-analytics-dashboard-smoke.js'
      - '.github/workflows/admin-analytics-dashboard.yml'
      - 'db/migrations/**'
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steamfusion
          POSTGRES_PASSWORD: steamfusion
          POSTGRES_DB: steamfusion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamfusion -d steamfusion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://steamfusion:steamfusion@localhost:5432/steamfusion
      POSTGRES_PASSWORD: steamfusion
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax
        run: |
          node --check src/platform/admin-dashboard-analytics.js
          node --check src/platform/admin-dashboard-data.js
          node --check src/platform/admin-dashboard-view.js
          node --check src/platform/admin-dashboard.js
          node --check scripts/admin-analytics-dashboard-smoke.js
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Period, revenue and PostgreSQL analytics smoke
        run: node scripts/admin-analytics-dashboard-smoke.js
