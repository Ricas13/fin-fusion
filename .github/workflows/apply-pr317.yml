name: Apply PR317 recurring billing and transactions

on:
  push:
    branches:
      - feature/recurring-subscriptions-and-transactions
    paths:
      - .github/workflows/apply-pr317.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/recurring-subscriptions-and-transactions
          fetch-depth: 0
      - name: Fetch subscription discovery branch
        run: git fetch origin feature/current-subscription-discovery:refs/remotes/origin/feature/current-subscription-discovery
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
      - name: Apply production patch
        run: python3 scripts/apply_pr317.py
      - name: Normalize generated file preambles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['src/payments/transaction-browser.js','src/platform/admin-transactions.js','scripts/transaction-browser-smoke.js']:
              p=Path(name)
              text=p.read_text()
              if text.startswith('\\\n'):
                  p.write_text(text[2:])
          PY
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run focused regressions
        run: node scripts/subscription-discovery-smoke.js && node scripts/transaction-browser-smoke.js && node scripts/admin-navigation-coherence-smoke.js && node scripts/customer-bot-commerce-smoke.js
      - name: Run syntax checks
        run: npm run syntax
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/payments/subscription-discovery.js \
            src/payments/lifecycle.js \
            src/payments/transaction-browser.js \
            src/platform/admin-billing.js \
            src/platform/admin-transactions.js \
            src/platform/admin-route-composition.js \
            src/platform/admin-nav.js \
            scripts/subscription-discovery-smoke.js \
            scripts/transaction-browser-smoke.js \
            scripts/admin-navigation-coherence-smoke.js \
            scripts/customer-bot-commerce-smoke.js \
            package.json
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "Link current subscriptions and add transaction ledger"
          git push origin HEAD:feature/recurring-subscriptions-and-transactions
