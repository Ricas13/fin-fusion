name: Branch Hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml

permissions:
  contents: write

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  prune-merged-branches:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Delete branches fully contained in main
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          deleted=0
          kept=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            if [[ "$branch" == "main" || "$branch" == "HEAD" ]]; then
              continue
            fi

            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "Deleting fully merged branch: $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "Keeping branch with commits not contained in main: $branch"
              kept=$((kept + 1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          {
            echo '## Branch hygiene'
            echo
            echo "- Deleted fully merged branches: $deleted"
            echo "- Kept branches with unique commits: $kept"
            echo '- Protected branch: main'
          } >> "$GITHUB_STEP_SUMMARY"
