name: Fleet Aware Placement

on:
  pull_request:
    paths:
      - 'src/jellyfin/placement.js'
      - 'src/platform/admin-plan-placement-fleet.js'
      - 'platform-preload.js'
      - 'scripts/fleet-aware-placement-smoke.js'
      - '.github/workflows/fleet-aware-placement.yml'
  workflow_dispatch:

jobs:
  fleet-aware-placement:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_placement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fleet_placement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check src/jellyfin/placement.js
          node --check src/platform/admin-plan-placement-fleet.js
          node --check scripts/fleet-aware-placement-smoke.js
          node --check platform-preload.js
      - name: Migrate database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fleet_placement
        run: npm run db:migrate
      - name: Prefer real fleet load and fall back safely when stale
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fleet_placement
          PLACEMENT_FLEET_METRICS_STALE_SECONDS: '300'
        run: node scripts/fleet-aware-placement-smoke.js
