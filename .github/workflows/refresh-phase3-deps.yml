name: Refresh Phase 3 dependencies

on:
  push:
    branches: ['agent/customer-billing-provisioning-impl']

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-billing-provisioning-impl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current Stripe SDK and refresh lockfile
        run: |
          npm install stripe@latest --save-exact
          npm audit fix --package-lock-only
          npm ci
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Commit dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Lock Stripe SDK dependency'
          git push origin HEAD:agent/customer-billing-provisioning-impl
