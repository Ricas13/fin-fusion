name: Schema Baseline
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: steamfusion
          POSTGRES_PASSWORD: steamfusion
          POSTGRES_DB: steamfusion_baseline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamfusion -d steamfusion_baseline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://steamfusion:steamfusion@127.0.0.1:5432/steamfusion_baseline
      NODE_ENV: test
      SESSION_SECRET: baseline-session-secret-0123456789abcdef0123456789abcdef
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JELLYFIN_ENCRYPTION_KEY: 1123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ACTIVITY_ENCRYPTION_KEY: 2123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_ENCRYPTION_KEY: 3123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BACKUP_ENCRYPTION_KEY: 5123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Generate and verify clean baseline
        shell: bash
        run: |
          docker run --rm --network host postgres:17-alpine \
            pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges \
            --exclude-table=schema_migrations \
            --exclude-table=user_sessions \
            > /tmp/schema-baseline.sql
          term="$(printf 're%s' 'seller')"
          if grep -in "$term" /tmp/schema-baseline.sql; then
            echo "::error::Retired product vocabulary remains in generated schema"
            exit 1
          fi
          sed -e '/^\\restrict /d' -e '/^\\unrestrict /d' /tmp/schema-baseline.sql > db/migrations/000_schema_baseline.sql
      - name: Commit generated baseline when changed
        shell: bash
        run: |
          if git diff --quiet -- db/migrations/000_schema_baseline.sql && git ls-files --error-unmatch db/migrations/000_schema_baseline.sql >/dev/null 2>&1; then
            echo "Baseline already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add db/migrations/000_schema_baseline.sql
          git commit -m "Add clean PostgreSQL schema baseline"
          git push origin "HEAD:${{ github.head_ref }}"
