name: Storefront v2

on:
  pull_request:
    paths:
      - 'src/platform/storefront.js'
      - 'public/css/storefront.css'
      - 'scripts/storefront-v2-smoke.js'
      - '.github/workflows/storefront-v2.yml'
  workflow_dispatch:

jobs:
  storefront-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check src/platform/storefront.js
          node --check scripts/storefront-v2-smoke.js
      - name: Storefront rendering and pricing behavior
        run: node scripts/storefront-v2-smoke.js
