name: Affiliate normalize
on:
  push:
    branches: [feat/affiliate-service-credits]
permissions:
  contents: write
jobs:
  run:
    if: github.event.head_commit.message != 'Normalize affiliate UI surfaces'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/affiliate-service-credits
      - run: python3 scripts/affiliate-normalize-once.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/platform/admin-plan-create-v2.js views/customer/dashboard.ejs
          git commit -m 'Normalize affiliate UI surfaces'
          git push origin HEAD:feat/affiliate-service-credits
