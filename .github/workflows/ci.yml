name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: steamfusion
          POSTGRES_PASSWORD: steamfusion
          POSTGRES_DB: steamfusion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamfusion -d steamfusion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://steamfusion:steamfusion@127.0.0.1:5432/steamfusion
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JELLYFIN_ENCRYPTION_KEY: 1123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ACTIVITY_ENCRYPTION_KEY: 2123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_ENCRYPTION_KEY: 3123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_2FA_ENROLLMENT_TOKEN: ci-admin-enrollment-approval-2026-very-long-value
      ACTIVITY_DB_PASSWORD: activity-ci-password-very-long-2026
      REQUIRE_ADMIN_2FA: 'true'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Schema smoke test
        run: |
          node - <<'NODE'
          const { query, getPool } = require('./src/db');
          (async () => {
            const plans = await query('SELECT code FROM plans ORDER BY sort_order, code');
            if (plans.rowCount < 4) throw new Error('Expected seeded plans');
            const tables = await query("SELECT to_regclass('public.payment_customers') AS payment_customers, to_regclass('public.provisioning_runs') AS provisioning_runs, to_regclass('public.active_playback_sessions') AS active_playback_sessions, to_regclass('public.playback_history') AS playback_history, to_regclass('public.stream_policy_events') AS stream_policy_events, to_regclass('public.auth_sessions') AS auth_sessions, to_regclass('public.auth_events') AS auth_events, to_regclass('public.auth_recovery_codes') AS auth_recovery_codes, to_regclass('public.auth_totp_enrollments') AS auth_totp_enrollments");
            for (const [name, value] of Object.entries(tables.rows[0])) if (!value) throw new Error(`Required table missing: ${name}`);
          })().finally(() => getPool().end());
          NODE

      - name: Purpose-key encryption smoke test
        run: |
          node - <<'NODE'
          const { encryptWithEnv, decryptWithEnv } = require('./src/security/purpose-crypto');
          const jf = encryptWithEnv('ci-sentinel', 'JELLYFIN_ENCRYPTION_KEY', 'jf1');
          const auth = encryptWithEnv('ci-auth-sentinel', 'AUTH_ENCRYPTION_KEY', 'authv1');
          if (!jf.startsWith('jf1:') || !auth.startsWith('authv1:')) throw new Error('Unexpected encryption format');
          if (jf.includes('ci-sentinel') || auth.includes('ci-auth-sentinel')) throw new Error('Ciphertext leaked plaintext');
          if (decryptWithEnv(jf, 'JELLYFIN_ENCRYPTION_KEY', 'jf1') !== 'ci-sentinel') throw new Error('Jellyfin key roundtrip failed');
          if (decryptWithEnv(auth, 'AUTH_ENCRYPTION_KEY', 'authv1') !== 'ci-auth-sentinel') throw new Error('Auth key roundtrip failed');
          let crossPurposeSucceeded = false;
          try { decryptWithEnv(auth, 'JELLYFIN_ENCRYPTION_KEY', 'authv1'); crossPurposeSucceeded = true; } catch (_) {}
          if (crossPurposeSucceeded) throw new Error('Cross-purpose key isolation failed');
          NODE

      - name: Security default smoke test
        run: |
          node - <<'NODE'
          const activity = require('./src/jellyfin/activity');
          const auth = require('./src/auth/service');
          const staff = require('./src/auth/staff-controller');
          delete process.env.STREAM_POLICY_MODE;
          delete process.env.STREAM_POLICY_ENFORCEMENT_ACK;
          let cfg = activity.config();
          if (cfg.effectiveMode !== 'observe') throw new Error('Default activity mode must be observe');
          process.env.STREAM_POLICY_MODE = 'enforce';
          cfg = activity.config();
          if (cfg.effectiveMode !== 'observe') throw new Error('Enforcement must remain disabled without acknowledgement');
          process.env.STREAM_POLICY_ENFORCEMENT_ACK = activity.ENFORCEMENT_ACK;
          cfg = activity.config();
          if (cfg.effectiveMode !== 'enforce') throw new Error('Explicit acknowledgement should enable enforcement');
          if (!auth.requiresTwoFactor({ role: 'admin', totp_enabled: false })) throw new Error('Admin 2FA must be required by default');
          if (staff.adminEnrollmentApproved('wrong-value')) throw new Error('Invalid admin enrollment approval was accepted');
          if (!staff.adminEnrollmentApproved(process.env.ADMIN_2FA_ENROLLMENT_TOKEN)) throw new Error('Valid admin enrollment approval was rejected');
          NODE

      - name: Native staff auth smoke test
        run: npm run auth:smoke

      - name: Compile security views
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ejs = require('ejs');
          for (const file of [
            'views/auth/staff-login.ejs','views/auth/2fa-challenge.ejs','views/auth/2fa-setup.ejs',
            'views/auth/recovery-codes.ejs','views/auth/message.ejs','views/admin/security.ejs',
            'views/admin/security-password.ejs','views/admin/security-recovery.ejs'
          ]) ejs.compile(fs.readFileSync(file,'utf8'));
          NODE

      - name: Native admin safety smoke test
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ejs = require('ejs');
          const users = require('./src/platform/admin-users');
          const servers = require('./src/platform/admin-servers');
          const { getPool } = require('./src/db');
          (async () => {
            process.env.NODE_ENV = 'production';
            process.env.JELLYFIN_ALLOWED_HOSTS = 'jellyfin.local,premium.example.com';
            const allowed = servers.normalizeUrl('http://jellyfin.local:8096/', { baseUrl: true });
            if (allowed !== 'http://jellyfin.local:8096') throw new Error('Allowed Jellyfin URL normalization failed');
            for (const bad of ['http://not-allowed.local:8096','ftp://jellyfin.local/file','http://user:pass@jellyfin.local:8096']) {
              let rejected = false;
              try { servers.normalizeUrl(bad, { baseUrl: true }); } catch (_) { rejected = true; }
              if (!rejected) throw new Error(`Unsafe Jellyfin URL accepted: ${bad}`);
            }
            const parsed = servers.parseServerForm({
              name:'CI Jellyfin',slug:'ci-jellyfin',serverClass:'premium',baseUrl:'http://jellyfin.local:8096',
              publicUrl:'https://premium.example.com',location:'CI',priority:'100',maxUsers:'500',
              allowNewUsers:'on',trialEnabled:'on',paidEnabled:'on',apiKey:'0123456789abcdef'
            }, { apiKeyRequired: true });
            if (!parsed.allowNewUsers || !parsed.trialEnabled || !parsed.paidEnabled) throw new Error('Server placement flags parsed incorrectly');
            if (!Array.isArray(await users.listUsers(''))) throw new Error('Users query did not return an array');
            if (await users.userDetail('00000000-0000-0000-0000-000000000000')) throw new Error('Unknown customer unexpectedly resolved');
            if (!Array.isArray(await servers.serverList())) throw new Error('Servers query did not return an array');
            for (const file of ['views/admin/servers.ejs','views/admin/server-form.ejs']) {
              ejs.compile(fs.readFileSync(file,'utf8'));
            }
          })().finally(() => getPool().end());
          NODE

      - name: Configure least-privilege activity role
        run: npm run db:activity-role

      - name: Verify activity database isolation
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const password = encodeURIComponent(process.env.ACTIVITY_DB_PASSWORD);
          const client = new Client({ connectionString: `postgres://steamfusion_activity:${password}@127.0.0.1:5432/steamfusion` });
          (async () => {
            await client.connect();
            await client.query('SELECT id,streams FROM plans LIMIT 1');
            const write = await client.query("INSERT INTO stream_policy_events(mode,decision,reason) VALUES('observe','observed','ci') RETURNING id");
            if (!write.rowCount) throw new Error('Activity role could not write policy event');
            let paymentDenied = false;
            try { await client.query('SELECT id FROM payment_events LIMIT 1'); }
            catch (error) { if (error.code === '42501') paymentDenied = true; else throw error; }
            if (!paymentDenied) throw new Error('Activity role unexpectedly has payment table access');
            let authDenied = false;
            try { await client.query('SELECT id FROM auth_events LIMIT 1'); }
            catch (error) { if (error.code === '42501') authDenied = true; else throw error; }
            if (!authDenied) throw new Error('Activity role unexpectedly has authentication table access');
          })().finally(() => client.end());
          NODE

      - name: Admin activity dashboard smoke test
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ejs = require('ejs');
          const activity = require('./src/jellyfin/activity');
          const { dashboardData } = require('./src/platform/admin-activity');
          const { getPool } = require('./src/db');
          (async () => {
            ejs.compile(fs.readFileSync('views/admin/activity.ejs','utf8'));
            const data = await dashboardData(activity.config());
            if (!Array.isArray(data.streams) || !Array.isArray(data.servers) || !Array.isArray(data.events)) throw new Error('Dashboard data shape invalid');
          })().finally(() => getPool().end());
          NODE

      - name: Customer platform smoke test
        run: node scripts/platform-smoke.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
