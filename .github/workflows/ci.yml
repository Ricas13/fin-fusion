name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: steamfusion
          POSTGRES_PASSWORD: steamfusion
          POSTGRES_DB: steamfusion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamfusion -d steamfusion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://steamfusion:steamfusion@127.0.0.1:5432/steamfusion
      APP_DATABASE_URL: postgres://steamfusion_app:ci-app-password-2026-very-long-value@127.0.0.1:5432/steamfusion
      AUTOMATION_DATABASE_URL: postgres://steamfusion_automation:ci-automation-password-2026-very-long-value@127.0.0.1:5432/steamfusion
      ACTIVITY_DATABASE_URL: postgres://steamfusion_activity:activity-ci-password-very-long-2026@127.0.0.1:5432/steamfusion
      BACKUP_DATABASE_URL: postgres://steamfusion_backup:ci-backup-password-2026-very-long-value@127.0.0.1:5432/steamfusion
      BACKUP_VERIFY_DATABASE_URL: postgres://steamfusion_backup_verify:ci-backup-verify-password-2026-very-long@127.0.0.1:5432/steamfusion
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JELLYFIN_ENCRYPTION_KEY: 1123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ACTIVITY_ENCRYPTION_KEY: 2123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_ENCRYPTION_KEY: 3123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_2FA_ENROLLMENT_TOKEN: ci-admin-enrollment-approval-2026-very-long-value
      ACTIVITY_DB_PASSWORD: activity-ci-password-very-long-2026
      REQUIRE_ADMIN_2FA: 'true'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compose migration wiring smoke test
        run: node scripts/compose-migration-smoke.js

      - name: Syntax checks
        run: npm run syntax

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Schema and clean-install smoke test
        run: |
          node - <<'NODE'
          const { query, getPool } = require('./src/db');
          (async () => {
            const businessCounts = await query(`
              SELECT
                (SELECT COUNT(*)::int FROM jellyfin_servers) AS servers,
                (SELECT COUNT(*)::int FROM customers) AS customers,
                (SELECT COUNT(*)::int FROM subscriptions) AS subscriptions
            `);
            for (const [name, value] of Object.entries(businessCounts.rows[0])) {
              if (Number(value) !== 0) throw new Error(`Fresh CI database unexpectedly seeded ${name}: ${value}`);
            }
            const plans = await query(`
              SELECT code,is_free_tier,active,visible,price_minor,capacity_limit,billing_interval
              FROM plans ORDER BY code
            `);
            if (plans.rowCount !== 1) throw new Error(`Fresh CI database must contain only the permanent free tier; found ${plans.rowCount} plans`);
            const free = plans.rows[0];
            if (!free.is_free_tier || !free.active || !free.visible) throw new Error('Permanent free tier must be marked, active and visible');
            if (Number(free.price_minor) !== 0) throw new Error('Permanent free tier must remain zero-priced');
            if (Number(free.capacity_limit) !== 0) throw new Error('Fresh permanent free tier must start with zero configured spots');
            if (free.billing_interval === 'trial') throw new Error('Permanent free tier must not be a trial plan');
            const clean = await query("SELECT setting_value FROM platform_settings WHERE setting_key='installation'");
            if (clean.rows[0]?.setting_value?.cleanInstall !== true) throw new Error('Clean-install marker missing');
            const platform = await query("SELECT setting_value FROM platform_settings WHERE setting_key='platform'");
            if (platform.rows[0]?.setting_value?.storefrontEnabled !== false) throw new Error('Fresh storefront must be disabled');
            if (platform.rows[0]?.setting_value?.publicRegistration !== false) throw new Error('Fresh registration must be disabled');

            const tables = await query("SELECT to_regclass('public.payment_customers') AS payment_customers, to_regclass('public.provisioning_runs') AS provisioning_runs, to_regclass('public.active_playback_sessions') AS active_playback_sessions, to_regclass('public.playback_history') AS playback_history, to_regclass('public.stream_policy_events') AS stream_policy_events, to_regclass('public.auth_sessions') AS auth_sessions, to_regclass('public.auth_events') AS auth_events, to_regclass('public.auth_recovery_codes') AS auth_recovery_codes, to_regclass('public.auth_totp_enrollments') AS auth_totp_enrollments, to_regclass('public.customer_provisioning_state') AS customer_provisioning_state, to_regclass('public.customer_invitations') AS customer_invitations");
            for (const [name, value] of Object.entries(tables.rows[0])) if (!value) throw new Error(`Required table missing: ${name}`);
          })().finally(() => getPool().end());
          NODE

      - name: Fast checks
        run: npm run check

      - name: Purpose-key encryption smoke test
        run: |
          node - <<'NODE'
          const { encryptWithEnv, decryptWithEnv } = require('./src/security/purpose-crypto');
          const jf = encryptWithEnv('ci-sentinel', 'JELLYFIN_ENCRYPTION_KEY', 'jf1');
          const auth = encryptWithEnv('ci-auth-sentinel', 'AUTH_ENCRYPTION_KEY', 'authv1');
          if (!jf.startsWith('jf1:') || !auth.startsWith('authv1:')) throw new Error('Unexpected encryption format');
          if (jf.includes('ci-sentinel') || auth.includes('ci-auth-sentinel')) throw new Error('Ciphertext leaked plaintext');
          if (decryptWithEnv(jf, 'JELLYFIN_ENCRYPTION_KEY', 'jf1') !== 'ci-sentinel') throw new Error('Jellyfin key roundtrip failed');
          if (decryptWithEnv(auth, 'AUTH_ENCRYPTION_KEY', 'authv1') !== 'ci-auth-sentinel') throw new Error('Auth key roundtrip failed');
          let crossPurposeSucceeded = false;
          try { decryptWithEnv(auth, 'JELLYFIN_ENCRYPTION_KEY', 'authv1'); crossPurposeSucceeded = true; } catch (_) {}
          if (crossPurposeSucceeded) throw new Error('Cross-purpose key isolation failed');
          NODE

      - name: Security default smoke test
        run: |
          node - <<'NODE'
          const activity = require('./src/jellyfin/activity');
          const auth = require('./src/auth/service');
          const staff = require('./src/auth/staff-controller');
          delete process.env.STREAM_POLICY_MODE;
          delete process.env.STREAM_POLICY_ENFORCEMENT_ACK;
          let cfg = activity.config();
          if (cfg.effectiveMode !== 'observe') throw new Error('Default activity mode must be observe');
          process.env.STREAM_POLICY_MODE = 'enforce';
          cfg = activity.config();
          if (cfg.effectiveMode !== 'observe') throw new Error('Enforcement must remain disabled without acknowledgement');
          process.env.STREAM_POLICY_ENFORCEMENT_ACK = activity.ENFORCEMENT_ACK;
          cfg = activity.config();
          if (cfg.effectiveMode !== 'enforce') throw new Error('Explicit acknowledgement should enable enforcement');
          if (!auth.requiresTwoFactor({ role: 'admin', totp_enabled: false })) throw new Error('Admin 2FA must be required by default');
          if (staff.adminEnrollmentApproved('wrong-value')) throw new Error('Invalid admin enrollment approval was accepted');
          if (!staff.adminEnrollmentApproved(process.env.ADMIN_2FA_ENROLLMENT_TOKEN)) throw new Error('Valid admin enrollment approval was rejected');
          NODE

      - name: Native staff auth smoke test
        run: npm run auth:smoke

      - name: Compile security views
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ejs = require('ejs');
          for (const file of [
            'views/auth/staff-login.ejs','views/auth/2fa-challenge.ejs','views/auth/2fa-setup.ejs',
            'views/auth/recovery-codes.ejs','views/auth/message.ejs','views/admin/security.ejs',
            'views/admin/security-password.ejs','views/admin/security-recovery.ejs'
          ]) ejs.compile(fs.readFileSync(file,'utf8'));
          NODE

      - name: Native admin safety smoke test
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ejs = require('ejs');
          const users = require('./src/platform/admin-users');
          const servers = require('./src/platform/admin-servers');
          const customerFilters = require('./src/platform/customer-filters');
          const { getPool } = require('./src/db');
          (async () => {
            process.env.NODE_ENV = 'production';
            delete process.env.JELLYFIN_ALLOWED_HOSTS;
            const arbitrary = servers.normalizeUrl('http://not-allowed.local:8096/', { baseUrl: true });
            if (arbitrary !== 'http://not-allowed.local:8096') throw new Error('Admin-added Jellyfin URL normalization failed');
            for (const bad of ['ftp://jellyfin.local/file','http://user:pass@jellyfin.local:8096']) {
              let rejected = false;
              try { servers.normalizeUrl(bad, { baseUrl: true }); } catch (_) { rejected = true; }
              if (!rejected) throw new Error(`Unsafe Jellyfin URL accepted: ${bad}`);
            }
            const parsed = servers.parseServerForm({
              name:'CI Jellyfin',slug:'ci-jellyfin',serverClass:'premium',baseUrl:'http://jellyfin.local:8096',
              publicUrl:'https://premium.example.com',location:'CI',priority:'100',maxUsers:'500',
              allowNewUsers:'on',trialEnabled:'on',paidEnabled:'on',apiKey:'0123456789abcdef'
            }, { apiKeyRequired: true });
            if (!parsed.allowNewUsers || !parsed.trialEnabled || !parsed.paidEnabled) throw new Error('Server placement flags parsed incorrectly');
            const listed = await customerFilters.listCustomers({}, null, {});
            if (!Array.isArray(listed.rows)) throw new Error('Customers query did not return an array');
            if (await users.userDetail('00000000-0000-0000-0000-000000000000')) throw new Error('Unknown customer unexpectedly resolved');
            if (!Array.isArray(await servers.serverList())) throw new Error('Servers query did not return an array');
            for (const file of ['views/admin/servers.ejs','views/admin/server-form.ejs']) {
              ejs.compile(fs.readFileSync(file,'utf8'));
            }
          })().finally(() => getPool().end());
          NODE

      - name: Configure isolated runtime database roles
        run: npm run db:runtime-roles

      - name: Verify runtime database isolation
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          const urls = {
            app: process.env.APP_DATABASE_URL,
            automation: process.env.AUTOMATION_DATABASE_URL,
            activity: process.env.ACTIVITY_DATABASE_URL,
            backup: process.env.BACKUP_DATABASE_URL,
            verify: process.env.BACKUP_VERIFY_DATABASE_URL
          };
          async function denied(client, sql, label) {
            let ok = false;
            try { await client.query(sql); }
            catch (error) { if (error.code === '42501') ok = true; else throw error; }
            if (!ok) throw new Error(`${label} unexpectedly succeeded`);
          }
          async function use(url, fn) {
            const client = new Client({ connectionString: url });
            await client.connect();
            try { await fn(client); } finally { await client.end(); }
          }
          (async () => {
            await use(urls.app, async client => {
              await client.query('SELECT id,code FROM plans LIMIT 1');
              await client.query('BEGIN');
              await client.query("INSERT INTO audit_log(action,entity_type,entity_id,metadata) VALUES('ci.runtime.app','ci','app','{}'::jsonb)");
              await client.query('ROLLBACK');
              await denied(client, 'CREATE TABLE ci_app_forbidden(id int)', 'app DDL');

              // Regression coverage for the production bug fixed by
              // 20260905001000_fix_jellyfin_account_creation_intent_permissions.sql:
              // the web process (steamfusion_app) must have full CRUD on the
              // durable Jellyfin account-creation intent table and on the
              // canonical service-scoped admin-authority table, or provisioning
              // and "return to automatic management" fail in production even
              // though the table exists.
              await client.query('BEGIN');
              const server = await client.query("SELECT id FROM jellyfin_servers LIMIT 1");
              const customer = await client.query("INSERT INTO customers(display_name,email,registration_source) VALUES('CI runtime role check','ci-runtime-role-check@example.invalid','public') RETURNING id");
              const customerId = customer.rows[0].id;
              if (server.rowCount) {
                const serverId = server.rows[0].id;
                await client.query('INSERT INTO jellyfin_account_creation_intents(customer_id,server_id,username) VALUES($1,$2,$3)', [customerId, serverId, 'ci-role-check-user']);
                await client.query("UPDATE jellyfin_account_creation_intents SET status='remote_created',remote_user_id='ci-role-check-remote' WHERE customer_id=$1", [customerId]);
                await client.query('DELETE FROM jellyfin_account_creation_intents WHERE customer_id=$1', [customerId]);
              }
              await client.query("INSERT INTO customer_service_admin_control(customer_id,service,mode,reason) VALUES($1,'jellyfin','admin_present','ci role check')", [customerId]);
              await client.query("UPDATE customer_service_admin_control SET reason='ci role check updated' WHERE customer_id=$1 AND service='jellyfin'", [customerId]);
              await client.query("DELETE FROM customer_service_admin_control WHERE customer_id=$1 AND service='jellyfin'", [customerId]);
              await client.query('ROLLBACK');
            });

            await use(urls.automation, async client => {
              await client.query('SELECT id,status FROM subscriptions LIMIT 1');
              await client.query('BEGIN');
              await client.query("INSERT INTO automation_job_state(job_key,enabled,interval_seconds) VALUES('ci_role_test',FALSE,300) ON CONFLICT(job_key) DO NOTHING");
              await client.query('ROLLBACK');
              await denied(client, 'SELECT * FROM auth_recovery_codes LIMIT 1', 'automation auth secret read');
              await denied(client, 'UPDATE app_users SET username=username', 'automation identity mutation');
            });

            await use(urls.activity, async client => {
              await client.query('SELECT id,streams FROM plans LIMIT 1');
              const write = await client.query("INSERT INTO stream_policy_events(mode,decision,reason) VALUES('observe','observed','ci') RETURNING id");
              if (!write.rowCount) throw new Error('Activity role could not write policy event');
              await denied(client, 'SELECT id FROM payment_events LIMIT 1', 'activity payment read');
              await denied(client, 'SELECT id FROM auth_events LIMIT 1', 'activity auth read');
            });

            await use(urls.backup, async client => {
              await client.query('SELECT id FROM auth_events LIMIT 1');
              await client.query('BEGIN');
              await client.query("INSERT INTO backup_runs(status,backup_type) VALUES('running','database')");
              await client.query('ROLLBACK');
              await denied(client, 'UPDATE customers SET display_name=display_name', 'backup production mutation');
              await denied(client, 'CREATE TABLE ci_backup_forbidden(id int)', 'backup DDL');
            });

            await use(urls.verify, async client => {
              await denied(client, 'SELECT id FROM plans LIMIT 1', 'backup verifier production read');
              const db = `ci_runtime_verify_${Date.now()}`;
              await client.query(`CREATE DATABASE ${db}`);
              await client.query(`DROP DATABASE ${db} WITH (FORCE)`);
            });
          })();
          NODE

      - name: Admin activity dashboard smoke test
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ejs = require('ejs');
          const activity = require('./src/jellyfin/activity');
          const { dashboardData } = require('./src/platform/admin-activity');
          const { getPool } = require('./src/db');
          (async () => {
            ejs.compile(fs.readFileSync('views/admin/activity.ejs','utf8'));
            const data = await dashboardData(activity.config());
            if (!Array.isArray(data.streams) || !Array.isArray(data.servers) || !Array.isArray(data.events)) throw new Error('Dashboard data shape invalid');
          })().finally(() => getPool().end());
          NODE

      - name: Customer platform smoke test
        run: node scripts/platform-smoke.js

      - name: Bulk jobs and reconciliation smoke test
        run: node scripts/bulk-jobs-smoke.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
