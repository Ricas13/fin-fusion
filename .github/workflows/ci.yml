name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: steamfusion
          POSTGRES_PASSWORD: steamfusion
          POSTGRES_DB: steamfusion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steamfusion -d steamfusion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://steamfusion:steamfusion@127.0.0.1:5432/steamfusion
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Legacy and platform syntax checks
        run: npm run check

      - name: Activity worker syntax checks
        run: |
          node --check src/jellyfin/activity.js
          node --check scripts/activity-worker.js

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Schema smoke test
        run: |
          node - <<'NODE'
          const { query, getPool } = require('./src/db');
          (async () => {
            const plans = await query('SELECT code FROM plans ORDER BY sort_order, code');
            if (plans.rowCount < 4) throw new Error('Expected seeded plans');
            const tables = await query("SELECT to_regclass('public.payment_customers') AS payment_customers, to_regclass('public.provisioning_runs') AS provisioning_runs, to_regclass('public.active_playback_sessions') AS active_playback_sessions, to_regclass('public.playback_history') AS playback_history, to_regclass('public.stream_policy_events') AS stream_policy_events");
            for (const [name, value] of Object.entries(tables.rows[0])) {
              if (!value) throw new Error(`Required table missing: ${name}`);
            }
            console.log('Schema smoke test passed:', plans.rows.map(p => p.code).join(', '));
          })().finally(() => getPool().end());
          NODE

      - name: Security default smoke test
        run: |
          node - <<'NODE'
          const activity = require('./src/jellyfin/activity');
          delete process.env.STREAM_POLICY_MODE;
          delete process.env.STREAM_POLICY_ENFORCEMENT_ACK;
          let cfg = activity.config();
          if (cfg.effectiveMode !== 'observe') throw new Error('Default activity mode must be observe');
          process.env.STREAM_POLICY_MODE = 'enforce';
          cfg = activity.config();
          if (cfg.effectiveMode !== 'observe') throw new Error('Enforcement must remain disabled without acknowledgement');
          process.env.STREAM_POLICY_ENFORCEMENT_ACK = activity.ENFORCEMENT_ACK;
          cfg = activity.config();
          if (cfg.effectiveMode !== 'enforce') throw new Error('Explicit acknowledgement should enable enforcement');
          if (cfg.confirmationsRequired < 2) throw new Error('At least two confirmations are required');
          console.log('Security defaults verified');
          NODE

      - name: Customer platform smoke test
        run: node scripts/platform-smoke.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
