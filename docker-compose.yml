services:
  migrate:
    build: .
    restart: "no"
    env_file: .env
    command: ["sh", "-c", "npm run db:migrate && npm run db:runtime-roles && npm run auth:bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/app/db:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    build: .
    container_name: steam-fusion
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3030}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      SITE_NAME: ${SITE_NAME:-}
      CAPTAINFIN_UPDATE_CHECK_ENABLED: ${CAPTAINFIN_UPDATE_CHECK_ENABLED:-true}
      STOREFRONT_ENABLED: ${STOREFRONT_ENABLED:-false}
      PUBLIC_REGISTRATION: ${PUBLIC_REGISTRATION:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      ENTITLEMENT_JOB_INTERVAL_MS: ${ENTITLEMENT_JOB_INTERVAL_MS:-300000}
      SERVER_HEALTH_INTERVAL_MS: ${SERVER_HEALTH_INTERVAL_MS:-300000}
      DATABASE_URL: ${APP_DATABASE_URL:?set APP_DATABASE_URL in .env}
      DB_POOL_SIZE: ${APP_DB_POOL_SIZE:-10}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      JELLYFIN_ENCRYPTION_KEY: ${JELLYFIN_ENCRYPTION_KEY:?set JELLYFIN_ENCRYPTION_KEY in .env}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?set AUTH_ENCRYPTION_KEY in .env}
      ALLOW_LEGACY_DATA_KEY_FOR_JELLYFIN: ${ALLOW_LEGACY_DATA_KEY_FOR_JELLYFIN:-false}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-steamfusion.sid}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REQUIRE_ADMIN_2FA: ${REQUIRE_ADMIN_2FA:-false}
      AUTH_FAILURE_LIMIT: ${AUTH_FAILURE_LIMIT:-5}
      AUTH_LOCK_MINUTES: ${AUTH_LOCK_MINUTES:-15}
      STAFF_SESSION_HOURS: ${STAFF_SESSION_HOURS:-12}
      PASSWORD_BREACH_CHECK_MODE: ${PASSWORD_BREACH_CHECK_MODE:-required}
      PASSWORD_BREACH_CHECK_TIMEOUT_MS: ${PASSWORD_BREACH_CHECK_TIMEOUT_MS:-5000}
      ADMIN_2FA_ENROLLMENT_TOKEN: ${ADMIN_2FA_ENROLLMENT_TOKEN:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_PUBLIC_URL: ${JELLYFIN_PUBLIC_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      LEGACY_SERVER_NAME: ${LEGACY_SERVER_NAME:-}
      LEGACY_SERVER_SLUG: ${LEGACY_SERVER_SLUG:-}
      LEGACY_SERVER_CLASS: ${LEGACY_SERVER_CLASS:-}
      STREAM_POLICY_MODE: ${STREAM_POLICY_MODE:-observe}
      STREAM_POLICY_POLL_SECONDS: ${STREAM_POLICY_POLL_SECONDS:-30}
      STREAM_POLICY_POLL_SLACK_SECONDS: ${STREAM_POLICY_POLL_SLACK_SECONDS:-60}
      ACTIVITY_WORKER_HEARTBEAT_MS: ${ACTIVITY_WORKER_HEARTBEAT_MS:-15000}
      STREAM_POLICY_ACTIVE_WINDOW_SECONDS: ${STREAM_POLICY_ACTIVE_WINDOW_SECONDS:-120}
      STREAM_POLICY_GRACE_SECONDS: ${STREAM_POLICY_GRACE_SECONDS:-45}
      STREAM_POLICY_CONFIRMATIONS: ${STREAM_POLICY_CONFIRMATIONS:-2}
      STREAM_POLICY_COUNT_PAUSED: ${STREAM_POLICY_COUNT_PAUSED:-false}
      STREAM_POLICY_ENFORCEMENT_ACK: ${STREAM_POLICY_ENFORCEMENT_ACK:-}
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-90}
      POLICY_EVENT_RETENTION_DAYS: ${POLICY_EVENT_RETENTION_DAYS:-365}
      STRIPE_RESTRICTED_KEY: ${STRIPE_RESTRICTED_KEY:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_URL: ${SMTP_URL:-}
      SEERR_URL: ${SEERR_URL:-}
      OVERSEERR_URL: ${OVERSEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      OVERSEERR_API_KEY: ${OVERSEERR_API_KEY:-}
      REQUEST_USER_SYNC_INTERVAL_MS: ${REQUEST_USER_SYNC_INTERVAL_MS:-900000}
      STREMIO_RUNTIME_ENABLED: ${STREMIO_RUNTIME_ENABLED:-false}
      STREMIO_JELLYFIN_TOKEN_KEY: ${STREMIO_JELLYFIN_TOKEN_KEY:-}
      STREMIO_EDGE_AUTH_ENABLED: ${STREMIO_EDGE_AUTH_ENABLED:-false}
      STREMIO_EDGE_AUTH_SECRET: ${STREMIO_EDGE_AUTH_SECRET:-}
      STREMIO_EDGE_GRANT_TTL_SECONDS: ${STREMIO_EDGE_GRANT_TTL_SECONDS:-21600}
      BACKUP_OFFSITE_ENABLED: ${BACKUP_OFFSITE_ENABLED:-false}
      BACKUP_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-s3}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - ./db:/app/db:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  automation-worker:
    build: .
    container_name: steam-fusion-automation
    restart: unless-stopped
    command: ["node", "scripts/automation-worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${AUTOMATION_DATABASE_URL:?set AUTOMATION_DATABASE_URL in .env}
      DB_POOL_SIZE: ${AUTOMATION_DB_POOL_SIZE:-6}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY in .env}
      JELLYFIN_ENCRYPTION_KEY: ${JELLYFIN_ENCRYPTION_KEY:?set JELLYFIN_ENCRYPTION_KEY in .env}
      ALLOW_LEGACY_DATA_KEY_FOR_JELLYFIN: ${ALLOW_LEGACY_DATA_KEY_FOR_JELLYFIN:-false}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_PUBLIC_URL: ${JELLYFIN_PUBLIC_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      LEGACY_SERVER_NAME: ${LEGACY_SERVER_NAME:-}
      LEGACY_SERVER_SLUG: ${LEGACY_SERVER_SLUG:-}
      LEGACY_SERVER_CLASS: ${LEGACY_SERVER_CLASS:-}
      STRIPE_RESTRICTED_KEY: ${STRIPE_RESTRICTED_KEY:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_URL: ${SMTP_URL:-}
      SEERR_URL: ${SEERR_URL:-}
      OVERSEERR_URL: ${OVERSEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      OVERSEERR_API_KEY: ${OVERSEERR_API_KEY:-}
      REQUEST_USER_SYNC_INTERVAL_MS: ${REQUEST_USER_SYNC_INTERVAL_MS:-900000}
      STREMIO_RUNTIME_ENABLED: ${STREMIO_RUNTIME_ENABLED:-false}
      AUTOMATION_WORKER_POLL_MS: ${AUTOMATION_WORKER_POLL_MS:-15000}
      AUTOMATION_WORKER_CONCURRENCY: ${AUTOMATION_WORKER_CONCURRENCY:-3}
      AUTOMATION_WORKER_HEARTBEAT_MS: ${AUTOMATION_WORKER_HEARTBEAT_MS:-15000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});const max=Math.max(90,Math.ceil(Number(process.env.AUTOMATION_WORKER_HEARTBEAT_MS||15000)/1000)*4);c.connect().then(()=>c.query(\"SELECT EXTRACT(EPOCH FROM (NOW()-last_heartbeat_at)) age FROM operational_worker_state WHERE worker_key='automation' AND instance_id=$1 AND draining_at IS NULL\",[process.env.HOSTNAME])).then(r=>{const ok=r.rowCount&&Number(r.rows[0].age)<max;return c.end().then(()=>process.exit(ok?0:1))}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  activity-worker:
    build: .
    container_name: steam-fusion-activity
    restart: unless-stopped
    command: ["node", "scripts/activity-worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ACTIVITY_DATABASE_URL: ${ACTIVITY_DATABASE_URL:?set ACTIVITY_DATABASE_URL in .env}
      JELLYFIN_ENCRYPTION_KEY: ${JELLYFIN_ENCRYPTION_KEY:?set JELLYFIN_ENCRYPTION_KEY in .env}
      ACTIVITY_ENCRYPTION_KEY: ${ACTIVITY_ENCRYPTION_KEY:?set ACTIVITY_ENCRYPTION_KEY in .env}
      DB_POOL_SIZE: ${ACTIVITY_DB_POOL_SIZE:-3}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      STREAM_POLICY_MODE: ${STREAM_POLICY_MODE:-observe}
      STREAM_POLICY_POLL_SECONDS: ${STREAM_POLICY_POLL_SECONDS:-30}
      STREAM_POLICY_POLL_SLACK_SECONDS: ${STREAM_POLICY_POLL_SLACK_SECONDS:-60}
      ACTIVITY_WORKER_HEARTBEAT_MS: ${ACTIVITY_WORKER_HEARTBEAT_MS:-15000}
      STREAM_POLICY_ACTIVE_WINDOW_SECONDS: ${STREAM_POLICY_ACTIVE_WINDOW_SECONDS:-120}
      STREAM_POLICY_GRACE_SECONDS: ${STREAM_POLICY_GRACE_SECONDS:-45}
      STREAM_POLICY_CONFIRMATIONS: ${STREAM_POLICY_CONFIRMATIONS:-2}
      STREAM_POLICY_COUNT_PAUSED: ${STREAM_POLICY_COUNT_PAUSED:-false}
      STREAM_POLICY_ENFORCEMENT_ACK: ${STREAM_POLICY_ENFORCEMENT_ACK:-}
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-90}
      POLICY_EVENT_RETENTION_DAYS: ${POLICY_EVENT_RETENTION_DAYS:-365}
      FLEET_METRICS_POLL_SECONDS: ${FLEET_METRICS_POLL_SECONDS:-60}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');try{const s=fs.statSync('/tmp/activity-heartbeat');process.exit(Date.now()-s.mtimeMs<120000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup-worker:
    build: .
    container_name: steam-fusion-backup
    restart: unless-stopped
    user: "${BACKUP_PUID:-1000}:${BACKUP_PGID:-1000}"
    command: ["node", "scripts/backup-worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${BACKUP_DATABASE_URL:?set BACKUP_DATABASE_URL in .env}
      BACKUP_VERIFY_DATABASE_URL: ${BACKUP_VERIFY_DATABASE_URL:?set BACKUP_VERIFY_DATABASE_URL in .env}
      DB_POOL_SIZE: ${BACKUP_DB_POOL_SIZE:-3}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY in .env}
      BACKUP_DIR: /backups
      BACKUP_RESTORE_TMPDIR: /tmp/restore
      BACKUP_WORKER_POLL_MS: ${BACKUP_WORKER_POLL_MS:-60000}
      BACKUP_OFFSITE_ENABLED: ${BACKUP_OFFSITE_ENABLED:-false}
      BACKUP_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-s3}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_SESSION_TOKEN: ${BACKUP_S3_SESSION_TOKEN:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-captainfin/}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
      BACKUP_S3_MAX_ATTEMPTS: ${BACKUP_S3_MAX_ATTEMPTS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "node", "scripts/backup-healthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  recovery-tools:
    build: .
    profiles: ["recovery"]
    user: "${BACKUP_PUID:-1000}:${BACKUP_PGID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY in .env}
      BACKUP_DIR: /backups
      BACKUP_RESTORE_TMPDIR: /tmp
      BACKUP_OFFSITE_ENABLED: ${BACKUP_OFFSITE_ENABLED:-false}
      BACKUP_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-s3}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_SESSION_TOKEN: ${BACKUP_S3_SESSION_TOKEN:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-captainfin/}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
      BACKUP_S3_MAX_ATTEMPTS: ${BACKUP_S3_MAX_ATTEMPTS:-3}
    volumes:
      - ./backups:/backups
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: steam-fusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: steamfusion
      POSTGRES_USER: steamfusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - steamfusion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamfusion -d steamfusion"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  steamfusion_pgdata:
