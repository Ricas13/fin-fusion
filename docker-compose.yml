services:
  migrate:
    build: .
    restart: "no"
    env_file: .env
    command: ["sh", "-c", "npm run db:migrate && if [ -n \"${ACTIVITY_DB_PASSWORD:-}\" ]; then npm run db:activity-role; else echo 'ACTIVITY_DB_PASSWORD not set; skipping dedicated activity role configuration'; fi && npm run auth:bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/app/db:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    build: .
    container_name: steam-fusion
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - ./db:/app/db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  automation-worker:
    build: .
    container_name: steam-fusion-automation
    restart: unless-stopped
    command: ["node", "scripts/automation-worker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query(\"SELECT EXTRACT(EPOCH FROM (NOW()-last_heartbeat_at)) age FROM operational_worker_state WHERE worker_key='automation'\")).then(r=>{const ok=r.rowCount&&Number(r.rows[0].age)<90;return c.end().then(()=>process.exit(ok?0:1))}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  activity-worker:
    build: .
    container_name: steam-fusion-activity
    restart: unless-stopped
    command: ["node", "scripts/activity-worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ACTIVITY_DATABASE_URL: ${ACTIVITY_DATABASE_URL:?set ACTIVITY_DATABASE_URL in .env}
      JELLYFIN_ENCRYPTION_KEY: ${JELLYFIN_ENCRYPTION_KEY:?set JELLYFIN_ENCRYPTION_KEY in .env}
      ACTIVITY_ENCRYPTION_KEY: ${ACTIVITY_ENCRYPTION_KEY:?set ACTIVITY_ENCRYPTION_KEY in .env}
      DB_POOL_SIZE: ${ACTIVITY_DB_POOL_SIZE:-3}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      STREAM_POLICY_MODE: ${STREAM_POLICY_MODE:-observe}
      STREAM_POLICY_POLL_SECONDS: ${STREAM_POLICY_POLL_SECONDS:-30}
      STREAM_POLICY_ACTIVE_WINDOW_SECONDS: ${STREAM_POLICY_ACTIVE_WINDOW_SECONDS:-120}
      STREAM_POLICY_GRACE_SECONDS: ${STREAM_POLICY_GRACE_SECONDS:-45}
      STREAM_POLICY_CONFIRMATIONS: ${STREAM_POLICY_CONFIRMATIONS:-2}
      STREAM_POLICY_COUNT_PAUSED: ${STREAM_POLICY_COUNT_PAUSED:-false}
      STREAM_POLICY_ENFORCEMENT_ACK: ${STREAM_POLICY_ENFORCEMENT_ACK:-}
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-90}
      POLICY_EVENT_RETENTION_DAYS: ${POLICY_EVENT_RETENTION_DAYS:-365}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');try{const s=fs.statSync('/tmp/activity-heartbeat');process.exit(Date.now()-s.mtimeMs<120000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup-worker:
    build: .
    container_name: steam-fusion-backup
    restart: unless-stopped
    command: ["node", "scripts/backup-worker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BACKUP_DIR: /backups
      BACKUP_RESTORE_TMPDIR: /tmp/restore
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query(\"SELECT EXTRACT(EPOCH FROM (NOW()-last_heartbeat_at)) age FROM backup_worker_state WHERE worker_key='database_backup'\")).then(r=>{const ok=r.rowCount&&Number(r.rows[0].age)<180;return c.end().then(()=>process.exit(ok?0:1))}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  recovery-tools:
    build: .
    profiles: ["recovery"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY in .env}
      BACKUP_DIR: /backups
      BACKUP_RESTORE_TMPDIR: /tmp
    volumes:
      - ./backups:/backups
    tmpfs:
      - /tmp:size=2g,mode=700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17-alpine
    container_name: steam-fusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: steamfusion
      POSTGRES_USER: steamfusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - steamfusion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamfusion -d steamfusion"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  steamfusion_pgdata:
