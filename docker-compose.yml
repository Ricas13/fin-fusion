services:
  app:
    build: .
    container_name: steam-fusion
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - ./db:/app/db

  postgres:
    image: postgres:17-alpine
    container_name: steam-fusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: steamfusion
      POSTGRES_USER: steamfusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - steamfusion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steamfusion -d steamfusion"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  steamfusion_pgdata:
